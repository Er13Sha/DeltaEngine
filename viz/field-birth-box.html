867,0.2879,0.3722],[2.756,-1.5451,-0.5069],[2.4504,0.6238,-2.0608],[-1.1481,-2.1311,-0.0821],[0.9563,0.6623,0.3997],[-2.4134,-1.8965,0.6709],[-2.2856,2.1741,0.4455],[0.7464,-0.0257,-2.0845],[2.536,2.5209,0.4003],[-1.8317,1.4574,1.4295],[3.3954,-0.5963,1.6614],[-0.2984,-1.8084,1.7034],[-0.6078,-0.8087,-2.597],[3.0232,1.426,0.3038],[-3.7334,0.4896,-0.5821],[0.4084,-2.7309,0.8069],[-0.8402,-2.6432,1.9073],[1.3153,0.9672,2.2468],[-1.9849,0.4469,1.4026],[-1.4694,2.5999,-2.4494],[0.3602,1.4388,1.2289],[-0.061,0.0712,-3.4957],[0.2944,1.4389,-2.5729],[0.1158,1.6232,2.8109],[1.2583,0.1007,-3.3033],[1.928,0.1088,0.2108],[-1.7928,-1.1289,3.2344],[-1.3631,-2.5847,-2.2516],[-0.289,0.1486,2.7319],[-2.7709,-0.3712,1.1558],[1.8295,1.745,-2.266],[-2.4779,0.1874,-0.73],[0.6845,-3.2015,-1.3995],[1.6797,-1.5845,-2.6212],[-0.9232,-2.0893,0.8727],[0.4726,-0.1493,3.0324],[-1.2346,3.3698,0.0479],[-1.2465,1.9198,2.6845],[-0.9432,-1.889,-3.1588],[-2.3794,-0.9323,-1.4309],[0.5183,0.763,3.0676],[1.1496,0.3019,2.2786],[1.8595,2.7259,-0.5105],[1.7065,1.0298,-0.9058],[1.7458,-1.2059,2.399],[0.5649,-1.8595,-2.9756],[2.3797,-3.0034,0.765],[2.0459,1.6608,-1.0338],[-2.9764,1.7293,-1.4831],[0.8628,-1.8232,2.8237],[2.5312,-2.4142,-1.3628],[-0.2218,2.5853,-0.3715],[-2.1908,-2.0435,-0.5256],[0.9296,3.4958,1.2688],[2.9635,0.9494,1.6184],[-1.0734,-0.061,2.2141],[1.6413,-0.404,-2.9353],[-1.4211,-2.7628,-1.6155],[1.1299,-2.5077,1.1716]]]};
    const GROUPS = {
      empty: [{ name: "середина", from: 0, to: 8, color: 0xf2c14e }],
      sea: [
        { name: "середина", from: 0, to: 8, color: 0xf2c14e },
        { name: "внутренняя оболочка", from: 8, to: 20, color: 0x7eb6ff },
        { name: "средняя оболочка", from: 20, to: 38, color: 0x8fd18d },
        { name: "внешняя оболочка", from: 38, to: 62, color: 0xd0d4dc }
      ]
    };

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById("view").appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121418);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 80);
    camera.position.set(9, 7, 11);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const key = new THREE.DirectionalLight(0xffffff, 1.1);
    key.position.set(6, 10, 4);
    scene.add(key);

    const wall = new THREE.Mesh(
      new THREE.SphereGeometry(DATA.wall, 48, 32),
      new THREE.MeshBasicMaterial({ color: 0x8aa0c8, wireframe: true, transparent: true, opacity: 0.35 })
    );
    scene.add(wall);

    const dot = new THREE.SphereGeometry(0.12, 16, 12);
    let meshes = [];
    let frames = DATA.sea;
    let frame = 0;
    let playing = true;

    function clearMeshes() {
      for (const mesh of meshes) {
        scene.remove(mesh);
        mesh.geometry.dispose();
        mesh.material.dispose();
      }
      meshes = [];
    }

    function build(name) {
      clearMeshes();
      frames = DATA[name];
      const groups = GROUPS[name];
      const legend = document.getElementById("legend");
      legend.replaceChildren();
      for (const group of groups) {
        const count = group.to - group.from;
        const material = new THREE.MeshStandardMaterial({ color: group.color, roughness: 0.45 });
        const mesh = new THREE.InstancedMesh(dot, material, count);
        mesh.userData.group = group;
        scene.add(mesh);
        meshes.push(mesh);
        const line = document.createElement("div");
        const mark = document.createElement("span");
        mark.className = "swatch";
        mark.style.background = "#" + group.color.toString(16).padStart(6, "0");
        line.append(mark, document.createTextNode(group.name + " · " + count));
        legend.append(line);
      }
      frame = Math.min(frame, frames.length - 1);
      show(frame);
    }

    const dummy = new THREE.Object3D();
    function show(index) {
      const positions = frames[index];
      for (const mesh of meshes) {
        const group = mesh.userData.group;
        for (let i = group.from; i < group.to; i += 1) {
          const p = positions[i];
          dummy.position.set(p[0], p[1], p[2]);
          dummy.updateMatrix();
          mesh.setMatrixAt(i - group.from, dummy.matrix);
        }
        mesh.instanceMatrix.needsUpdate = true;
      }
      const t = (index * DATA.dt).toFixed(1).replace(".", ",");
      document.getElementById("clock").textContent = "t = " + t;
      document.getElementById("time").value = String(index);
      document.getElementById("time").max = String(frames.length - 1);
    }

    document.getElementById("scene").addEventListener("change", (event) => build(event.target.value));
    document.getElementById("play").addEventListener("click", () => {
      playing = !playing;
      document.getElementById("play").textContent = playing ? "Пауза" : "Пуск";
    });
    document.getElementById("time").addEventListener("input", (event) => {
      playing = false;
      document.getElementById("play").textContent = "Пуск";
      show(Number(event.target.value));
    });
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    build("sea");
    let last = 0;
    function tick(now) {
      requestAnimationFrame(tick);
      if (playing && now - last > 70) {
        last = now;
        frame = (frame + 1) % frames.length;
        show(frame);
      }
      controls.update();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(tick);
  </script>
</body>
