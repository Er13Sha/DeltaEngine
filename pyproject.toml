[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-engine"
version = "0.0.1"
description = "Delta Engine: верифицируемый движок понятий на логических дельтах (рабочее название)"
readme = "README.md"
requires-python = ">=3.11"
# Доверенное ядро (delta_kernel) использует только стандартную библиотеку.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# Языковой слой Delta LM (вне доверенного ядра): морфология русского языка.
text = ["pymorphy3>=2", "pymorphy3-dicts-ru"]
# Трек E (модель поля, вне доверенного ядра): решётка и радиальные уравнения на CPU.
field = ["numpy>=2", "numba>=0.60", "scipy>=1.14"]
# Точная символьная алгебра (logical_delta_matter.exact_algebra). Вне ядра.
symbolic = ["sympy>=1.13"]
# Извлечение текста из PDF для реестра источников. Вне ядра.
sources = ["pypdf>=5"]

[tool.setuptools.packages.find]
include = ["delta_kernel*", "delta_science*", "delta_text*", "delta_tools*", "delta_app*", "adapters*", "logical_delta_matter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"
